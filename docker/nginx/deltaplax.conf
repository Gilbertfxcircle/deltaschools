# Delta Plax Education Suite - tenant routing (section 8.1).
# Routes <tenant>.deltaplax.com to the API and injects X-Tenant-ID so the
# FastAPI TenantMiddleware can pin the request to the correct schema.

upstream deltaplax_api {
    server api:8000;
}

# Per-tenant subdomains: stmarys.deltaplax.com, demo.deltaplax.com, ...
server {
    listen 80;
    server_name ~^(?<tenant>[^.]+)\.deltaplax\.com$;

    location / {
        proxy_pass http://deltaplax_api;
        proxy_set_header X-Tenant-ID $tenant;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Platform/admin host: admin.deltaplax.com and the bare apex - no tenant header.
server {
    listen 80 default_server;
    server_name deltaplax.com admin.deltaplax.com;

    location / {
        proxy_pass http://deltaplax_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
